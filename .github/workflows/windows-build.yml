name: Windows build

# Robin has no Windows machine: this runner is the only Windows build + the
# testers are colleagues, so keep the artifact easy to grab from the run page.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI bundle
        run: bash scripts/build-ui.sh

      # JUCE links WebView2LoaderStatic.lib from the NuGet package; the version
      # matches the one JUCE's FindWebView2.cmake recommends.
      - name: Install WebView2 SDK
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory nuget-packages

      - name: Configure
        run: cmake -B build -DTAGOCLIP_DEV_UI=OFF -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/nuget-packages"

      - name: Build VST3
        run: cmake --build build --config Release --target TagoClip_VST3

      # Guard for the static runtime in CMakeLists.txt: a binary that still
      # imports msvcp140/vcruntime140 crashes on machines with an old runtime
      # (Cubase 12 dump, msvcp140 14.34). Import names sit in the PE as plain
      # ASCII, so a grep is enough and needs no VS dev shell.
      - name: Check C++ runtime is linked statically
        shell: bash
        run: |
          BIN="build/TagoClip_artefacts/Release/VST3/TagoClip.vst3/Contents/x86_64-win/TagoClip.vst3"
          test -f "$BIN"
          if grep -a -i -o -E "(msvcp140|vcruntime140)[_0-9a-z]*\.dll" "$BIN" | sort -u | grep .; then
            echo "::error::$BIN still imports the dynamic MSVC runtime"
            exit 1
          fi
          echo "no dynamic MSVC runtime imports in $BIN"

      - name: Embed third-party attribution
        shell: bash
        run: |
          mkdir -p "build/TagoClip_artefacts/Release/VST3/TagoClip.vst3/Contents/Resources"
          cp THIRD_PARTY_LICENSES.txt "build/TagoClip_artefacts/Release/VST3/TagoClip.vst3/Contents/Resources/"

      # Der Runner ist die einzige Windows-Instanz, die es hier gibt, also ist
      # das auch der einzige Ort, an dem das Plugin je auf Windows geprueft
      # wird. Ohne diesen Schritt geht ein Build ungetestet ans Release.
      #
      # continue-on-error mit Absicht: der Schritt soll melden, nicht blockieren.
      # Ein Release am Stichtag darf nicht daran haengen, dass pluginval auf dem
      # Runner in ein Timeout laeuft. Ergebnis steht im Log, Konsequenzen zieht
      # ein Mensch. Sobald ein paar Laeufe sauber durch sind, kann das weg.
      # The PDB of exactly this build, so a tester's crash dump can be read.
      # Keep the artifact of every build that goes out to people.
      - name: Collect debug symbols
        shell: bash
        run: |
          mkdir -p symbols
          find build -name "*.pdb" -path "*Release*" -exec cp {} symbols/ \;
          ls -l symbols

      - uses: actions/upload-artifact@v4
        with:
          name: TagoClip-PDB-${{ github.sha }}
          path: symbols
          retention-days: 90

      - name: Validate VST3 (pluginval)
        continue-on-error: true
        shell: pwsh
        run: |
          # Version gepinnt, damit ein pluginval-Update nicht unbemerkt die
          # Ergebnisse verschiebt. Hochziehen ist eine bewusste Entscheidung.
          curl -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          # pluginval.exe is a GUI-subsystem binary, and pwsh does not wait for
          # those: without the pipe the step ended after a few seconds while
          # pluginval was still mid-run, so its result never reached the log.
          ./pluginval/pluginval.exe --strictness-level 5 --timeout-ms 300000 --validate-in-process `
            "build/TagoClip_artefacts/Release/VST3/TagoClip.vst3" | Out-Host
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: TagoClip-VST3-Windows
          path: build/TagoClip_artefacts/Release/VST3/TagoClip.vst3

      # On tag builds, attach the zipped VST3 to the GitHub release so the
      # macOS pkg and the Windows build hang off the same release.
      - name: Attach VST3 zip to release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/TagoClip_artefacts/Release/VST3
          # Eine nackte .vst3 im Zip laesst den Nutzer raten, wohin damit, und
          # sagt ihm nichts ueber die WebView2-Runtime. Fehlt die, bleibt das
          # Fenster schwarz, genau wie auf zu alten macOS-Versionen.
          cat > README.txt <<'TXT'
          TagoClip ${{ github.ref_name }} - Windows VST3

          INSTALL
            Copy TagoClip.vst3 into:
              C:\Program Files\Common Files\VST3
            Then rescan your plugin folders in the DAW.

          REQUIREMENTS
            Windows 10 or later, 64-bit.
            Microsoft Edge WebView2 Runtime, which draws the plugin's interface.
            It ships with Windows 11 and arrives on Windows 10 through Windows
            Update. If the plugin loads but its window stays black, that runtime
            is missing. Free download:
              https://developer.microsoft.com/microsoft-edge/webview2/

          SUPPORT
            Just reply to the download mail, or write to plugins@robinbusse.dev.
            Tell me your Windows version and DAW, that is usually enough to
            pin it down.

          TagoBeats - https://tagobeats.com
          TXT
          7z a -tzip "TagoClip-${{ github.ref_name }}-Windows-VST3.zip" TagoClip.vst3 README.txt > /dev/null
          gh release upload "${{ github.ref_name }}" "TagoClip-${{ github.ref_name }}-Windows-VST3.zip" --clobber --repo "${{ github.repository }}"
